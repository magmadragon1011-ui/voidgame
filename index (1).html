<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Catcher</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#20254a,#080b16 65%);color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.wrap{width:min(100%,760px);padding:18px;text-align:center}h1{margin:0 0 5px;font-size:clamp(24px,5vw,38px)}p{margin:0 0 14px;color:#aab4d0;font-size:13px}canvas{width:100%;max-width:700px;aspect-ratio:7/4;background:linear-gradient(#101b37,#090d1b);border:1px solid #6572a5;border-radius:14px;display:block;margin:auto;touch-action:none}button{margin-top:12px;border:0;border-radius:9px;padding:10px 18px;background:#9078ff;color:#fff;font-weight:700;cursor:pointer}small{display:block;color:#8792b1;margin-top:9px}</style></head><body><main class="wrap"><h1>🌟 Star Catcher</h1><p>Move with ← → or A / D. Catch stars and avoid meteors!</p><canvas id="game" width="700" height="400"></canvas><button id="restart">Start / Restart</button><small id="status">Press Start to play.</small></main><script>
const c=document.querySelector("#game"),x=c.getContext("2d"),status=document.querySelector("#status");let ship,stars,rocks,keys={},score=0,running=false,best=0,last=0,spawnAt=0;try{best=+(localStorage.getItem("starCatcherBest")||0)}catch{}
function reset(){ship={x:350,y:350,w:44,h:24};stars=[];rocks=[];keys={};score=0;running=true;last=0;spawnAt=0;requestAnimationFrame(loop)}
function hit(a,b){return Math.abs(a.x-b.x)<a.w/2+b.r&&Math.abs(a.y-b.y)<a.h/2+b.r}
function draw(){x.clearRect(0,0,700,400);for(let i=0;i<70;i++){x.fillStyle="#ffffff66";x.fillRect(i*97%700,(i*53+Date.now()*.012)%400,2,2)}x.textAlign="center";x.font="30px sans-serif";x.fillText("🚀",ship.x,ship.y+9);stars.forEach(s=>{x.font="25px sans-serif";x.fillText("⭐",s.x,s.y+8)});rocks.forEach(r=>{x.font="27px sans-serif";x.fillText("☄️",r.x,r.y+8)});x.textAlign="left";x.font="bold 16px system-ui";x.fillStyle="white";x.fillText("Score: "+score,16,27)}
function loop(t){if(!running)return;let d=Math.min((t-last)/16.7||1,2);last=t;if(keys.ArrowLeft||keys.a)ship.x-=5*d;if(keys.ArrowRight||keys.d)ship.x+=5*d;ship.x=Math.max(25,Math.min(675,ship.x));if(t-spawnAt>620){if(Math.random()<.7)stars.push({x:20+Math.random()*660,y:-15,r:9,s:2+Math.random()*2});else rocks.push({x:20+Math.random()*660,y:-20,r:13,s:2.5+Math.random()*2});spawnAt=t}stars.forEach(s=>s.y+=s.s*d);rocks.forEach(r=>r.y+=r.s*d);stars=stars.filter(s=>{if(hit(ship,s)){score++;return false}return s.y<420});for(const r of rocks)if(hit(ship,r)){running=false;best=Math.max(best,score);try{localStorage.setItem("starCatcherBest",best)}catch{}status.textContent=`Game over! Score ${score} · Best ${best}. Press Start to retry.`}rocks=rocks.filter(r=>r.y<420);draw();if(running){status.textContent=`Score: ${score} · Best: ${best}`;requestAnimationFrame(loop)}}
addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();keys[e.key]=true});addEventListener("keyup",e=>keys[e.key]=false);document.querySelector("#restart").onclick=reset;ship={x:350,y:350,w:44,h:24};stars=[];rocks=[];draw();
</script></body></html>
